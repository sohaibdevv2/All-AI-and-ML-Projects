<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <style>
        .center-heading {
            text-align: center;
            font-family: poppins, sans-serif; /* Modern sans-serif font */
            font-weight: 600; /* Lighter font weight for a modern look */
        }
        .main-container {
            /* Center content and limit maximum width for readability on large screens */
            max-width: 800px;
        }
        .form-control-lg {
            min-height: 150px; /* Give the textarea more visible space */
        }
    </style>
    <script src="./static/mywebscript.js"></script> 
    <title>NLP - Emotion Detection</title>
</head>
<body class="bg-light"> <div class="container main-container mt-5 p-4 shadow-lg rounded bg-white">
        <h1 class="center-heading mb-4 text-primary">NLP - Emotion Detection</h1>
        <hr class="mb-5">

        <div class="card border-0">
            <div class="card-body p-0">
                <h4 class="card-title mb-3 text-secondary">
                    Please enter the text to be analyzed:
                </h4>
                
                <div class="form-group">
                    <textarea class="form-control form-control-lg" id="textToAnalyze" rows="6" placeholder="Type your text here..."></textarea>
                </div>
                
                <div class="d-flex justify-content-center my-4">
                    <button onclick="RunSentimentAnalysis()" class="btn btn-primary btn-lg px-5">
                        Run Emotion Detection
                    </button>
                </div>
            </div>
            
            <hr class="my-5">

            <div class="card-body p-0">
                <h4 class="card-title mb-3 text-secondary">
                    Result of Emotion Detection:
                </h4>
                
                <div id="system_response" class="alert alert-info" role="alert" style="min-height: 100px;">
                    Analysis result will be displayed here...
                </div>
            </div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
</body>
</html>
